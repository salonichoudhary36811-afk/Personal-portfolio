<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 w-50">
<div class="card p-4 shadow border-dark">
<h3 class="text-center mb-4">Form</h3>
<form id="myform">
<div class="mb-3">
<input type=text id="name" placeholder="Enter your name" class="form-control" autofocus>
</div>

<div class="mb-3">
<input type=number id="sub1" class="form-control" placeholder="subject1">
</div>
<div class="mb-3">
<input type=number id="sub2" class="form-control" placeholder="subject2">
</div>
<div class="mb-3">
<input type=number id="sub3" class="form-control" placeholder="subject3">
</div>
<div class="mb-3">
<input type=number id="sub4" class="form-control" placeholder="subject4">
</div>
<div class="mb-3">
<input type=number id="sub5" class="form-control" placeholder="subject5">
</div>

<div class="text-center">
<button type="submit" class="btn btn-dark w-100 ">Check Result</button>
</div>
</form>
<div class="mt-3" id="result">
</div>
</div>


<script>
document.getElementById("myform").addEventListener("submit",function(e)
{e.preventDefault();

let name=document.getElementById("name").value;
let s1=Number(document.getElementById("sub1").value);
let s2=Number(document.getElementById("sub2").value);
let s3=Number(document.getElementById("sub3").value);
let s4=Number(document.getElementById("sub4").value);
let s5=Number(document.getElementById("sub5").value);

let total=s1+s2+s3+s4+s5;
let percent=total/5;

let grade=" ";

if(percent>=90)
{
grade="A+";
}
if(percent>=80)
{
grade="A";
}

if(percent>=70)
{
grade="B";
}

if(percent>=50)
{
grade="C";
}
if(percent>=30)
{
grade="Fail";
}
 
document.getElementById("result").innerHTML=

"<div class='card  shadow'>"+
"<h4>Name" + name +"</h4>"+
"<p>Total" + total + "</p>"+
"<p>Percentage" + percent + "%</p>"+
"<p>Grade" + grade + "</p>"+
"<p>Thank you" + name +"for coming</p>"+
"</div>";
});
</script>






</body>
</html>
