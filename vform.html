<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
               <div class="container mt-5 w-70">
               <div class="card shadow p-4">
               <h2 class=" mb-4 text-center">Form</h2>
               <form id="myform">
               <div class="mb-3">
               <label class="form-label">First name</label>
               <input type="text" class="form-control" id="fname" >
              <div class="invalid-feedback">First name is required</div>
               </div>

 <div class="mb-3">
               <label class="form-label">last name</label>
               <input type="text" class="form-control" id="lname"> 
              <div class="invalid-feedback">last name is required</div>

               </div>

 <div class="mb-3">
               <label class="form-label">Email</label>
               <input type="email" class="form-control" id="email">
              <div class="invalid-feedback">your email must include '@' and '.'</div>

               </div>

 <div class="mb-3">
               <label class="form-label">password</label>
               <input type="password" class="form-control" id="password">
              <div class="invalid-feedback">passoword must have atleast 6 chracters</div>

               </div>

 <div class="mb-3">
               <label class="form-label">phone</label>
               <input type="number" class="form-control" id="phone">
              <div class="invalid-feedback">it should be of 10 digits</div>

               </div>

 <div class="mb-3">
               <label class="form-label">Age</label>
               <input type="number" class="form-control"id="age">
              <div class="invalid-feedback">Age should between 0 to 100</div>

               </div>

 <div class="mb-3">
               <label class="form-label">Gender</label>
              <div class="form-check form-check-inline">
              <input type="radio" id="male" class="form-check-input">
              <label class="form-check-label">male</label>
               </div>

   <div class="form-check form-check-inline">
              <input type="radio" id="female" class="form-check-input">
              <label class="form-check-label">female</label>
               </div>
</div>

              <div class="text-center">
            <button type="submit" class="btn btn-dark">click on</button>
                </div>
               </form>
               </div>
               </div>


<script>
document.getElementById('myform').addEventListener('submit',function(e) { e.preventDefault(e);

let f=document.getElementById('fname').value.trim();
let l=document.getElementById('lname').value.trim();
let em=document.getElementById('email').value;
let p=document.getElementById('password').value;
let ag=document.getElementById('age').value;
let ph=document.getElementById('phone').value;

const check=(id,isCorrect)=>
{
let el=document.getElementById(id);
el.classList.toggle('is-valid',isCorrect);
el.classList.toggle('is-invalid',!isCorrect);
};

check('fname' ,f.length>0);
check('lname',l.length>0);
check('email', em.includes('@') &&em.includes('.'));
check('password',p.length>6);
check('phone',ph.length===10);
check('age',ag.length>0&&ag.length<=100);

if(document.querySelectorAll('.is-invalid').length===0)
{
alert("Your form is successfully submittted");
}
});
</script>
</body>
</html>
